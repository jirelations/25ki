- id: centersFutureGeorgia20202025
  abstract: >-
    The Future of Georgia project aims to understand significant issues in
    Georgia's recent past, to think about where Georgia is headed. The "Future
    of Georgia 2020" survey explores how Georgians perceive their national
    identity, values, and the country's political and social direction,
    including views on religion, minority rights, language, and foreign
    relations. It also gathers demographic data and examines attitudes toward
    past and present governments, historical events, and Georgia's place between
    Europe and Russia. The project is run in partnership with the Carnegie
    Foundation for International Peace Europe Office and the Levan Mikeladze
    Foundation. The project was financed by the Government of Sweden.


    Population: Adult population (18 years old and over), excluding the
    populations living in territories affected by military conflict (South
    Ossetia and Abkhazia). Besides nationwide, data is representative of
    Tbilisi, urban and rural areas of Georgia.


    Sample Design: Multi-stage cluster sampling with preliminary stratification.


    Sample Size: 1,928 respondents.


    Response rate: 32%


    Survey mode: Computer-assisted personal interview (CAPI).


    Interview languages: Georgian, Armenian and Azerbaijani.


    Fieldwork Dates: September 10, 2020 to September 28, 2020.


    Results are weighted.

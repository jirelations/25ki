- id: sonnleithnerDataMentionsNames2024
  abstract: "This graphs are the result of a distant reading of the Archives Parlementaires (AP), the edition of discourses (and documents related to discourses) pronounced in the French national assemblies during the French Revolution. We made a list of names of God and searched for them. We classified the results also according to time. We can get an idea of the changes in the frequency of mentions of God, and in the names used to speak of God.\n\nYet it must also be mentioned that we may not have identified all possible mentions of God, for two reasons: 1) God can be referred to implicitely or through rarer expressions; 2) there are OCR errors.\_\n\nThe actual figures should be thus significantly higher. In the framework of our project, we did not intend to obtain statistical precision. It was enough for us to show that mentions of God played an important role in the political culture of the French Revolution."

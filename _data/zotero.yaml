- id: songCulturalTheologySocial2025
  abstract: >-
    Developing ethical artificial intelligence has become crucial, especially as
    advancements in machine learning lead to the deployment of AI across
    society. Drawing on religious and cultural values exposes lacunae in current
    approaches to robotics and AI, and creates opportunities to design AI for
    human flourishing. The Korean value of jeong (empathy, solidarity, and
    mutual obligation) offers an example of such cultural theology for AI
    development. Prioritizing jeong in AI technologies could improve human-human
    and, theoretically, human-robot interactions. The conjunction of
    theological, religious studies, and social AI approaches shows that ethical
    AI requires more than western ethics. If AI incorporates human-human and
    human-AI jeong, the challenges of surveillance, algorithmic bias, and even
    hypothetical superintelligence become more manageable. It is the ability of
    religious studies to reveal and interrogate the contributions of global
    cultures that makes scholars vital in twenty-first century education,
    policymaking, and the technological marketplace.

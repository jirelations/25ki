  abstract: "This is a full set of transcriptions of all the interviews conducted to complete a research dedicated towards evaluating emotive research content, identifying areas of interest that may have not been the core areas in some of the original research papers, and creating a digital archaeo game or the purpose of testing the extracted theory in terms of emotive triggers in nostalgic and negative emotive archaeological environments. The transcriptions have been handwritten and reviewed several times but may contain some grammatical and spelling mistakes due to some issues with unstable connections during the video and audio recording or due to the inability to understand some of the spoken languages at times. Due to the nature of the research the interviewed subjects have\_ agreed in writing to be named and therefore it contains the real names of the people involved in the experiment.\n\n\nOverall this raw data set has been used to further investigate the area of emotive studies but may in the future be useful for many other applications as there were a wide variety of topics being discussed and the open-ended questions structure made this a very fruitful resource."

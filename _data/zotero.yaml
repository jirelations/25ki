- id: haoEmpireAIDreams2025
  abstract: >-
    "When AI expert and investigative journalist Karen Hao first began covering
    OpenAI in 2019, she thought they were the good guys. Founded as a nonprofit
    with safety enshrined as its core mission, the organization was meant, its
    leader Sam Altman told us, to act as a check against more purely mercantile,
    and potentially dangerous, forces. What could go wrong? Over time, Hao began
    to wrestle ever more deeply with that question. Increasingly, she realized
    that the core truth of this massively disruptive sector is that its vision
    of success requires an almost unprecedented amount of resources: the
    "compute" power of high-end chips and the processing capacity to create
    massive large language models, the sheer volume of data that needs to be
    amassed at scale, the humans "cleaning up" that data for sweatshop wages
    throughout the Global South, and a truly alarming spike in the usage of
    energy and water underlying it all. The truth is that we have entered a new
    and ominous age of empire: only a small handful of globally scaled companies
    can even enter the field of play. At the head of the pack with its ChatGPT
    breakthrough, how would OpenAI resist such temptations? Spoiler alert: it
    didn't. Armed with Microsoft's billions, OpenAI is setting a breakneck pace,
    chased by a small group of the most valuable companies in human
    history--toward what end, not even they can define. All this time, Hao has
    maintained her deep sourcing within the company and the industry, and so she
    was in intimate contact with the story that shocked the entire tech
    industry--Altman's sudden firing and triumphant return. The
    behind-the-scenes story of what happened, told here in full for the first
    time, is revelatory of who the people controlling this technology really
    are. But this isn't just the story of a single company, however fascinating
    it is. The g forces pressing down on the people of OpenAI are deforming the
    judgment of everyone else too--as such forces do. Naked power finds the
    ideology to cloak itself; no one thinks they're the bad guy. But in the
    meantime, as Hao shows through intrepid reporting on the ground around the
    world, the enormous wheels of extraction grind on. By drawing on the
    viewpoints of Silicon Valley engineers, Kenyan data laborers, and Chilean
    water activists, Hao presents the fullest picture of AI and its impact we've
    seen to date, alongside a trenchant analysis of where things are headed. An
    astonishing eyewitness view from both up in the command capsule of the new
    economy and down where the real suffering happens, Empire of AI pierces the
    veil of the industry defining our era" --Front sleeve of dust jacket
  author:

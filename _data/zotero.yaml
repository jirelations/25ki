- id: mollickCoIntelligenceLivingWorking2024
  abstract: >-
    AN INSTANT NEW YORK TIMES BESTSELLERFrom Wharton professor and author of the
    popular One Useful Thing Substack newsletter Ethan Mollick comes the
    definitive playbook for working, learning, and living in the new age of
    AISomething new entered our world in November 2022 — the first general
    purpose AI that could pass for a human and do the kinds of creative,
    innovative work that only humans could do previously. Wharton professor
    Ethan Mollick immediately understood what ChatGPT meant: after millions of
    years on our own, humans had developed a kind of co-intelligence that could
    augment, or even replace, human thinking. Through his writing, speaking, and
    teaching, Mollick has become one of the most prominent and provocative
    explainers of AI, focusing on the practical aspects of how these new tools
    for thought can transform our world. In Co-Intelligence, Mollick urges us to
    engage with AI as co-worker, co-teacher, and coach. He assesses its profound
    impact on business and education, using dozens of real-time examples of AI
    in action. Co-Intelligence shows what it means to think and work together
    with smart machines, and why it's imperative that we master that skill.
    Mollick challenges us to utilize AI's enormous power without losing our
    identity, to learn from it without being misled, and to harness its gifts to
    create a better human future. Wide ranging, hugely thought-provoking,
    optimistic, and lucid, Co-Intelligence reveals the promise and power of this
    new era.

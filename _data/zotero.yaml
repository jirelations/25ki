- id: ruskMetadataDataCollected2024
  abstract: "This archive contains metadata for material collected by the research project From the Ground Up: Buddhism and East Asian Religions (FROGBEAR), based at the University of British Columbia (UBC) and sponsored by a partnership grant from the\_Social Science and Humanities Research Council of Canada.\_\n\nThe project produced photographs and video recordings for the study of Buddhism and other religions of East Asia. They were collected primarily in China, Japan, Korea, Taiwan, and Thailand.\_\n\nThe material was collected between 2017 and 2023 by participants in the \_FROGBEAR project, and is also stored in the Open Collections of the UBC Library. It, and all the documents in this archive, are released under a Creative Commons Attribution 4.0 License.\n\nThe metadata consists of 1558 records, each describing one or more digital objects (files). These files will be available separately on Zenodo. In total 7806 files are described, in the following formats:\n\n\n\nJPEG image, 5862 files\n\nTIFF image, 1649 files\n\nPNG image, 157 files\n\nMP4 video, 104 files\n\nQuicktime video, 30 files\n\nMPEG video, 2 files\n\nPDF document, 1 file\n\nXLSX spreadsheet, 1 file\n\n\nThe metadata uses a subset of the Dublin Core Terms, as specified by the UBC Library.\_\n\nThe metadata is provided in several formats:\n\n\n\nA spreadsheet in OpenDocument Spreadsheet format, titled \"FROGBEAR Metadata and File List.ods\". This file contains two tables, FROGBEAR_Records, containing key data from all metadata records, and FROGBEAR_Files, containing a list of folder and filenames, keyed to the unique identifiers (ID) in the FROGBEAR_Records table.\n\nTwo Comma-Separated Value format files (UTF-8 encoding), containing the metadata records (\"FROGBEAR Metadata.csv\") and a list of files (\"FROGBEAR File List.csv\")\n\nComplete metadata in JSON format, with one JSON file for each record, in three folders representing separate collections in which the records were orginally stored in the UBC Library Open Collections. These categorizations are not relevant for most purposes, but are maintained for legacy compatibility:\n\n\n\n42591: Graduate Research\n\n52383: Faculty Research and Publications\n\n52387: UBC Community and Partner Publications\n\n\n\nComplete metadata in RDF XML format, with one XML file for each record, in the same structure as for JSON files above."
